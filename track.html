<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker Sea Joker</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding:16px; max-width:420px; margin:0 auto; }
  label { display:block; margin:10px 0 3px; color:var(--dim); font-size:12px; letter-spacing:1px; }
  input, select, button { width:100%; font-size:16px; padding:10px; }
  #go { margin-top:16px; border-color:var(--acc); color:var(--acc); font-size:18px; }
  #status { margin-top:14px; min-height:40px; } .ok { color:#4dff88; }
</style>
</head>
<body>
<h2>TRACKER POSIZIONE</h2>
<label for="pin">PIN</label><input id="pin" type="text" autocomplete="off">
<label for="callsign">CALLSIGN</label><input id="callsign" type="text" list="callsigns" autocomplete="off">
<datalist id="callsigns"></datalist>
<label for="faction">FAZIONE</label><select id="faction"></select>
<label for="squad">NOME SQUADRA</label><input id="squad" type="text" autocomplete="off">
<button id="go">Avvia</button>
<div id="status" class="dim">Fermo. Tieni lo schermo acceso.</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script type="module" src="js/track.js"></script>
</body>
</html>
